<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" type="text/css" th:href="@{/contact.css}">
    <th:block th:replace="~{fragment/header :: header-css}"></th:block>

</head>
<body>
<div th:replace="~{fragment/header :: common-header}"></div>
<div class="contact" id="contact">
    <h2 class="title" th:text="${Title}"></h2>
    <div class="contactInfo">
        <form method="post" action="">
            <fieldset>
                <label>
                    <input type="text" placeholder="Enter your name" required/>
                </label>
                <label>
                    <input type="email" placeholder="Enter your email" required/>
                </label>
                <label>
                    <input type="number" placeholder="enter your age" max="50" min="18" required/>
                </label>
                <label>
                    <input type="number" placeholder="Enter your number" required/>
                </label>
                <label>
                    <input type="text" placeholder="Enter your message"/>
                </label>
                <button type="submit">Submit</button>
            </fieldset>
        </form>
    </div>
</div>
</body>
</html>
